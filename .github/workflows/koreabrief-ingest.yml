name: Korea Brief data update

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'ingest=采集并补评少量旧数据；check=只检查；reassess=仅重评旧数据'
        required: true
        default: ingest
        type: choice
        options: [ingest, check, reassess]
      limit:
        description: '本次新闻AI评估上限（1–500）'
        required: true
        default: '300'
        type: string
      days:
        description: '重评历史范围天数（1–30）'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: koreabrief-database-writer
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PIPELINE_WORKDIR: ${{ vars.PIPELINE_WORKDIR || '.' }}
      RUN_MODE: ${{ inputs.mode || 'ingest' }}
      ITEM_LIMIT: ${{ inputs.limit || vars.INGEST_LIMIT || '300' }}
      HISTORY_DAYS: ${{ inputs.days || '30' }}
      BACKFILL_LIMIT: ${{ vars.BACKFILL_LIMIT || '40' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locate pipeline and validate options
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PIPELINE_WORKDIR/scripts/run-pipeline.ts" || { echo '找不到 scripts/run-pipeline.ts；核对仓库目录或 PIPELINE_WORKDIR 变量'; exit 1; }
          [[ "$RUN_MODE" =~ ^(ingest|check|reassess)$ ]] || exit 1
          [[ "$ITEM_LIMIT" =~ ^[1-9][0-9]*$ ]] && (( ITEM_LIMIT <= 500 )) || { echo 'limit 必须为1–500'; exit 1; }
          [[ "$HISTORY_DAYS" =~ ^[1-9][0-9]*$ ]] && (( HISTORY_DAYS <= 30 )) || exit 1
          [[ "$BACKFILL_LIMIT" =~ ^(0|[1-9][0-9]*)$ ]] && (( BACKFILL_LIMIT <= 100 )) || exit 1
          echo "PIPELINE_PROJECT=$(realpath "$PIPELINE_WORKDIR")" >> "$GITHUB_ENV"
          echo "PIPELINE_RUNTIME=$RUNNER_TEMP/koreabrief-runtime" >> "$GITHUB_ENV"
      - name: Install the existing collector dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$PIPELINE_RUNTIME" --no-save --no-package-lock --no-audit --no-fund \
            dotenv@18.0.9 drizzle-orm@0.45.2 pg@8.23.1 rss-parser@3.13.0 tsx@4.23.15
          test ! -e "$PIPELINE_PROJECT/node_modules" || { echo '采集工作区已有 node_modules，请检查是否误提交了依赖目录'; exit 1; }
          ln -s "$PIPELINE_RUNTIME/node_modules" "$PIPELINE_PROJECT/node_modules"
      - name: Check database and public access
        id: preflight
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PIPELINE_PROJECT"
          node --import "$PIPELINE_RUNTIME/node_modules/tsx/dist/loader.mjs" scripts/run-pipeline.ts --check
      - name: Collect or reassess
        if: env.RUN_MODE != 'check'
        id: collect
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          cd "$PIPELINE_PROJECT"
          if [[ "$RUN_MODE" == reassess ]]; then
            node --import "$PIPELINE_RUNTIME/node_modules/tsx/dist/loader.mjs" scripts/run-pipeline.ts --reassess-existing --days="$HISTORY_DAYS" --limit="$ITEM_LIMIT"
          else
            node --import "$PIPELINE_RUNTIME/node_modules/tsx/dist/loader.mjs" scripts/run-pipeline.ts --limit="$ITEM_LIMIT"
          fi
      - name: Gradually reassess the recent backlog
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && env.RUN_MODE == 'ingest' && env.BACKFILL_LIMIT != '0' }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          cd "$PIPELINE_PROJECT"
          node --import "$PIPELINE_RUNTIME/node_modules/tsx/dist/loader.mjs" scripts/run-pipeline.ts --reassess-existing --days=30 --limit="$BACKFILL_LIMIT"
      - name: Run summary
        if: always()
        shell: bash
        env:
          RUN_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Korea Brief data update'
            echo "- Mode: $RUN_MODE"
            echo "- Result: $RUN_RESULT"
            echo '- News, AI summaries and community observations are written to the existing Supabase table.'
            echo '- A failed source may make the job fail after other records have already been committed; inspect the counters in the logs.'
            echo '- No source-code commit or Vercel redeployment is required for data-only updates.'
          } >> "$GITHUB_STEP_SUMMARY"
